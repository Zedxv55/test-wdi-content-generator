  <nav class="rail" aria-label="เมนูหลัก">

<script src="page-common.js?v=3"></script>

<script src="dist-studio.js?v=1"></script>
<script>
function ctxCode(){try{return localStorage.getItem('wdi:selectedProduct')||new URLSearchParams(location.search).get('code')||''}catch(e){return ''}}
function setMode(m){var map={product:'index.html',set:'set.html',map:'map.html',image:'image.html',dist:'dist.html',pub:'pub.html'};var c=ctxCode();location.href=(map[m]||'index.html')+(c?'?code='+encodeURIComponent(c):'')}
function navDist(){var c=ctxCode();location.href='dist.html'+(c?'?code='+encodeURIComponent(c):'')}
function navPub(){location.href='pub.html'}
function toggleNav(){document.body.classList.toggle('nav-open')}
/* product-scoped drawers live on Product Studio — delegate with context */
function goIndex(){var c=ctxCode();location.href='index.html'+(c?'?code='+encodeURIComponent(c):'')}
function toggleAssistant(){goIndex()}
function openCreative(){goIndex()}
function closeCreative(){goIndex()}
function openHistory(){goIndex()}
function closeHistory(){goIndex()}
function openTruth(){goIndex()}
function closeTruth(){goIndex()}
function closeSceneEditor(){goIndex()}
</script>
<script>
async function chooseDistProduct(code){const d=await fetch('/api/products?q='+encodeURIComponent(code)+'&limit=5').then(r=>r.json());const list=Array.isArray(d)?d:(d.products||[]);const p=list.find(x=>x['Product Code']===code)||list[0];if(!p)return showToast('ไม่พบสินค้า',false);window.current=p;localStorage.setItem('wdi:selectedProduct',p['Product Code']);location.href='dist.html?code='+encodeURIComponent(p['Product Code'])}
async function initDist(){const p=await initPageCommon();if(p){$('contextCode').textContent=p['Product Code']||'';openDistStudio();return}const el=$('picker');el.classList.remove('hidden');el.innerHTML='<div class="text-lg font-black">เลือกสินค้าก่อนเริ่ม Distribution</div><p class="mt-2 text-sm" style="color:#8d99aa">ใส่รหัสสินค้า WDI แล้วเปิด workspace</p><div class="flex gap-2 mt-4"><input id="pickCode" class="flex-1" style="height:40px" placeholder="เช่น 04-60610L" aria-label="รหัสสินค้า"><button id="pickGo" class="btn-primary">เปิดสินค้า</button></div>';const go=$('pickGo');if(go)go.onclick=()=>chooseDistProduct($('pickCode').value.trim())}
document.addEventListener('DOMContentLoaded',initDist);
</script>
<script src="studio21-lite.js?v=1"></script>
</body>
</html>
